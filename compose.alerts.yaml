name: assetpulse-alerts
services:
  redis:
    image: redis:7.2-alpine
    container_name: assetpulse-alert-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["alert_redis:/data"]
    networks: [assetpulse]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27.8
    container_name: assetpulse-mailpit
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes: ["mailpit:/data"]
    ports: ["127.0.0.1:8026:8025"]
    networks: [assetpulse]
    restart: unless-stopped
  worker:
    image: apache/superset:3.0.0
    container_name: assetpulse-alert-worker
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_home/assetpulse_alert_config.py
    volumes: ["superset_home:/app/superset_home"]
    command: ["celery", "--app=superset.tasks.celery_app:app", "worker", "--loglevel=INFO", "--concurrency=1", "--hostname=assetpulse-alert-worker@%h"]
    networks: [assetpulse]
    depends_on:
      redis: {condition: service_healthy}
    healthcheck: {disable: true}
    restart: unless-stopped
  beat:
    image: apache/superset:3.0.0
    container_name: assetpulse-alert-beat
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_home/assetpulse_alert_config.py
    volumes: ["superset_home:/app/superset_home", "beat:/var/lib/celery"]
    user: root
    command: ["celery", "--app=superset.tasks.celery_app:app", "beat", "--loglevel=INFO", "--schedule=/var/lib/celery/schedule"]
    networks: [assetpulse]
    depends_on:
      redis: {condition: service_healthy}
    healthcheck: {disable: true}
    restart: unless-stopped
networks:
  assetpulse:
    external: true
    name: assetpulse-equipment-intelligence_default
volumes:
  superset_home:
    external: true
    name: assetpulse_superset_home
  alert_redis:
  mailpit:
  beat:
