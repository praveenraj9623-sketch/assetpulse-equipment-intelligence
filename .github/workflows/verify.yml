name: Verify ingestion and SQL
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: assetpulse
          POSTGRES_PASSWORD: assetpulse_local_dev
          POSTGRES_DB: assetpulse
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U assetpulse -d assetpulse"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ASSET_TEST_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  docker-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180 app
      - run: curl --fail http://localhost:8501/_stcore/health
      - if: always()
        run: docker compose logs --tail 80 app
      - if: always()
        run: docker compose down
