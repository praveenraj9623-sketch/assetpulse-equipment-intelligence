metrics:
- metric_name: Low pressure among loaded (%)
  verbose_name: Low pressure among loaded (%)
  metric_type: null
  expression: 100.0 * SUM(low_pressure_loaded_readings) / NULLIF(SUM(loaded_readings),
    0)
  description: TP3 < 7 bar and motor current >= 6 A, divided by loaded observations.
    NULL when none loaded.
  d3format: .2f
  currency: null
  extra: null
  warning_text: null
- metric_name: Panel pressure (bar)
  verbose_name: Panel pressure (bar)
  metric_type: null
  expression: SUM(panel_pressure_sum) / NULLIF(SUM(readings), 0)
  description: Observation-weighted TP3 pressure. Denominator is observations.
  d3format: .3f
  currency: null
  extra: null
  warning_text: null
- metric_name: Pressure gap (bar)
  verbose_name: Pressure gap (bar)
  metric_type: null
  expression: SUM(pressure_gap_sum) / NULLIF(SUM(readings), 0)
  description: Observation-weighted absolute TP3 minus reservoir pressure.
  d3format: .3f
  currency: null
  extra: null
  warning_text: null
- metric_name: Oil temperature (C)
  verbose_name: Oil temperature (C)
  metric_type: null
  expression: SUM(oil_temperature_sum) / NULLIF(SUM(readings), 0)
  description: Observation-weighted oil temperature, degrees Celsius.
  d3format: .2f
  currency: null
  extra: null
  warning_text: null
- metric_name: Loaded observations
  verbose_name: Loaded observations
  metric_type: null
  expression: COALESCE(SUM(loaded_readings), 0)
  description: Motor current >= 6 A; observation count, not duration.
  d3format: ',.0f'
  currency: null
  extra: null
  warning_text: null
- metric_name: Observations
  verbose_name: Observations
  metric_type: null
  expression: COALESCE(SUM(readings), 0)
  description: Sensor observations; additive across disjoint time bins.
  d3format: ',.0f'
  currency: null
  extra: null
  warning_text: null
