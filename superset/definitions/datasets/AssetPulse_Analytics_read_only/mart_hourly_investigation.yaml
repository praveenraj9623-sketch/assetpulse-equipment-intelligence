table_name: mart_hourly_investigation
main_dttm_col: hour_ts
description: One row per observed hour with prior seven-day context. Maintenance overlap
  is an external overlay, never rule input.
default_endpoint: null
offset: 0
cache_timeout: 0
schema: public
sql: null
params: null
template_params: null
filter_select_enabled: true
fetch_values_predicate: null
extra: null
normalize_columns: false
uuid: 646e06b4-2d83-4934-aa7a-307954a253ec
metrics:
- metric_name: Prior 7-day loaded share (%)
  verbose_name: Prior 7-day loaded share (%)
  metric_type: null
  expression: CASE WHEN COUNT(*) = 1 THEN 100.0 * MAX(prior_low_fraction) END
  description: Hourly point only. Ratio of prior low/loaded counts; excludes current
    hour. NULL when grouping multiple hours to prevent overlapping-window averaging.
  d3format: .2f
  currency: null
  extra: null
  warning_text: null
- metric_name: Low pressure among loaded (%)
  verbose_name: Low pressure among loaded (%)
  metric_type: null
  expression: 100.0 * SUM(low_pressure_loaded_readings) / NULLIF(SUM(loaded_readings),
    0)
  description: TP3 < 7 bar and motor current >= 6 A, divided by loaded observations.
    NULL when none loaded.
  d3format: .2f
  currency: null
  extra: null
  warning_text: null
- metric_name: Eligibility (%)
  verbose_name: Eligibility (%)
  metric_type: null
  expression: 100.0 * COUNT(*) FILTER (WHERE rule_eligible) / NULLIF(COUNT(*), 0)
  description: Eligible observed hours / all observed hours in the selected period.
    Not elapsed calendar hours; NULL for an empty period.
  d3format: .2f
  currency: null
  extra: null
  warning_text: null
- metric_name: 2x prior baseline (%)
  verbose_name: 2x prior baseline (%)
  metric_type: null
  expression: CASE WHEN COUNT(*) = 1 THEN 200.0 * MAX(prior_low_fraction) END
  description: Hourly point only; current share must meet BOTH this threshold and
    15% floor.
  d3format: .2f
  currency: null
  extra: null
  warning_text: null
- metric_name: Missing rates
  verbose_name: Missing rates
  metric_type: null
  expression: COUNT(*) FILTER (WHERE NOT current_samples_insufficient AND NOT baseline_samples_insufficient
    AND NOT rule_eligible)
  description: 'Defensive exclusion: no valid rate despite sufficient counts; not
    coerced to no breach.'
  d3format: ',.0f'
  currency: null
  extra: null
  warning_text: null
- metric_name: Eligible hours
  verbose_name: Eligible hours
  metric_type: null
  expression: COUNT(*) FILTER (WHERE rule_eligible)
  description: Current loaded count >=30 and preceding seven-day loaded count >=300,
    with both rates available.
  d3format: ',.0f'
  currency: null
  extra: null
  warning_text: null
- metric_name: Both sample requirements
  verbose_name: Both sample requirements
  metric_type: null
  expression: COUNT(*) FILTER (WHERE current_samples_insufficient AND baseline_samples_insufficient)
  description: Both sample minima fail; mutually exclusive with the single-reason
    counts.
  d3format: ',.0f'
  currency: null
  extra: null
  warning_text: null
- metric_name: Not evaluated hours
  verbose_name: Not evaluated hours
  metric_type: null
  expression: COUNT(*) FILTER (WHERE evaluation_status = 'Not evaluated')
  description: Excluded hours are not evaluated no-breach results.
  d3format: ',.0f'
  currency: null
  extra: null
  warning_text: null
- metric_name: Baseline samples only
  verbose_name: Baseline samples only
  metric_type: null
  expression: COUNT(*) FILTER (WHERE baseline_samples_insufficient AND NOT current_samples_insufficient)
  description: Prior loaded samples <300; current samples >=30.
  d3format: ',.0f'
  currency: null
  extra: null
  warning_text: null
- metric_name: Current samples only
  verbose_name: Current samples only
  metric_type: null
  expression: COUNT(*) FILTER (WHERE current_samples_insufficient AND NOT baseline_samples_insufficient)
  description: Current loaded samples <30; baseline samples >=300.
  d3format: ',.0f'
  currency: null
  extra: null
  warning_text: null
- metric_name: Candidate hours
  verbose_name: Candidate hours
  metric_type: null
  expression: COUNT(*) FILTER (WHERE candidate_status = 'REVIEW_PRESSURE')
  description: Observed hours meeting unchanged pressure-v1 rule.
  d3format: ',.0f'
  currency: null
  extra: null
  warning_text: null
- metric_name: Panel pressure (bar)
  verbose_name: Panel pressure (bar)
  metric_type: null
  expression: SUM(panel_pressure_sum) / NULLIF(SUM(readings), 0)
  description: Observation-weighted TP3 pressure. Denominator is observations.
  d3format: .3f
  currency: null
  extra: null
  warning_text: null
- metric_name: Pressure gap (bar)
  verbose_name: Pressure gap (bar)
  metric_type: null
  expression: SUM(pressure_gap_sum) / NULLIF(SUM(readings), 0)
  description: Observation-weighted absolute TP3 minus reservoir pressure.
  d3format: .3f
  currency: null
  extra: null
  warning_text: null
- metric_name: Oil temperature (C)
  verbose_name: Oil temperature (C)
  metric_type: null
  expression: SUM(oil_temperature_sum) / NULLIF(SUM(readings), 0)
  description: Observation-weighted oil temperature, degrees Celsius.
  d3format: .2f
  currency: null
  extra: null
  warning_text: null
- metric_name: Loaded observations
  verbose_name: Loaded observations
  metric_type: null
  expression: COALESCE(SUM(loaded_readings), 0)
  description: Motor current >= 6 A; observation count, not duration.
  d3format: ',.0f'
  currency: null
  extra: null
  warning_text: null
- metric_name: Rule floor (%)
  verbose_name: Rule floor (%)
  metric_type: null
  expression: '15.0'
  description: pressure-v1 fixed floor; eligibility also required.
  d3format: .1f
  currency: null
  extra: null
  warning_text: null
- metric_name: Observed hours
  verbose_name: Observed hours
  metric_type: null
  expression: COUNT(*)
  description: Observed hourly windows, not elapsed operating hours.
  d3format: ',.0f'
  currency: null
  extra: null
  warning_text: null
- metric_name: Observations
  verbose_name: Observations
  metric_type: null
  expression: COALESCE(SUM(readings), 0)
  description: Sensor observations; additive across disjoint time bins.
  d3format: ',.0f'
  currency: null
  extra: null
  warning_text: null
