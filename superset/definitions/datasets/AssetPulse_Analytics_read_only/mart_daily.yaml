table_name: mart_daily
main_dttm_col: reading_date
description: One row per observed date. Reweight daily means by readings for multi-day
  summaries.
default_endpoint: null
offset: 0
cache_timeout: 0
schema: public
sql: null
params: null
template_params: null
filter_select_enabled: true
